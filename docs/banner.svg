<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-label="ChainGuard — Ethereum address risk scoring">
  <title>ChainGuard — Ethereum address risk scoring</title>
  <defs>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="298" rx="16"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="16" fill="#F6F8FA" stroke="#E3E8EE" stroke-width="2"/>

  <!-- forensic-ledger corner ticks -->
  <g clip-path="url(#clip)" stroke="#93A1B2" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M22,40 V22 H40"/>
    <path d="M1178,40 V22 H1160"/>
    <path d="M22,260 V278 H40"/>
    <path d="M1178,260 V278 H1160"/>
  </g>

  <!-- grounding shadow -->
  <ellipse cx="600" cy="202" rx="190" ry="7" fill="#16202E" opacity="0.045" filter="url(#soft)"/>

  <!-- 3D wordmark: fading long-shadow tail + bevel highlight + flat front face -->
  <g font-family="Arial, 'Helvetica Neue', sans-serif" font-weight="900" font-size="104" letter-spacing="-2" text-anchor="middle">
    <g fill="#2952CC">
      <text x="600" y="158" opacity="0.40" transform="translate(2,2)">ChainGuard</text>
      <text x="600" y="158" opacity="0.34" transform="translate(4,4)">ChainGuard</text>
      <text x="600" y="158" opacity="0.28" transform="translate(6,6)">ChainGuard</text>
      <text x="600" y="158" opacity="0.22" transform="translate(8,8)">ChainGuard</text>
      <text x="600" y="158" opacity="0.17" transform="translate(10,10)">ChainGuard</text>
      <text x="600" y="158" opacity="0.12" transform="translate(12,12)">ChainGuard</text>
      <text x="600" y="158" opacity="0.08" transform="translate(14,14)">ChainGuard</text>
      <text x="600" y="158" opacity="0.05" transform="translate(16,16)">ChainGuard</text>
      <text x="600" y="158" opacity="0.02" transform="translate(18,18)">ChainGuard</text>
    </g>
    <text x="600" y="158" fill="#FFFFFF" opacity="0.35" transform="translate(-1,-1)">ChainGuard</text>
    <text x="600" y="158" fill="#16202E">ChainGuard</text>
  </g>

  <!-- tagline -->
  <text x="600" y="216" text-anchor="middle" font-family="Consolas, 'JetBrains Mono', monospace" font-size="16" letter-spacing="3.5" fill="#5B6B7F">ETHEREUM ADDRESS RISK SCORING</text>

  <!-- accent rule -->
  <line x1="562" y1="234" x2="638" y2="234" stroke="#2952CC" stroke-width="2.5" stroke-linecap="round"/>

  <!-- band-colour legend, echoing the score ring -->
  <g font-family="Consolas, 'JetBrains Mono', monospace" font-size="12" fill="#93A1B2">
    <circle cx="486" cy="258" r="3.5" fill="#2E7D5B"/>
    <text x="496" y="262">LOW</text>
    <circle cx="558" cy="258" r="3.5" fill="#B7791F"/>
    <text x="568" y="262">MEDIUM</text>
    <circle cx="656" cy="258" r="3.5" fill="#B3372E"/>
    <text x="666" y="262">HIGH</text>
  </g>
</svg>
